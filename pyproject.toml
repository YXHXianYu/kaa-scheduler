[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaa-scheduler"
version = "0.1.0"
description = "Windows scheduler for the UU + kaa daily automation flow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"Pillow>=10.0.0",
	"pywinauto>=0.6.8",
]

[project.scripts]
kaa-scheduler = "kaa_scheduler.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
